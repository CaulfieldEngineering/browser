# Joe's own iPhone browser (prototype, 2026-10-29: "Go ahead and build a prototype. For now just a basic, clean sleek
# browser."). XcodeGen turns this into Browser.xcodeproj on the macOS runner (.github/workflows/ios-build.yml).
# Signing is the HQ and Blocks setup: the same Apple team and Apple Distribution certificate, an ad-hoc profile of its
# own named exactly "Browser AdHoc" (scripts/apple-provision.mjs).
name: Browser
options:
  bundleIdPrefix: com.caulfieldengineering
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Browser:
    type: application
    platform: iOS
    sources:
      - path: Browser
      # The Instagram filter's page side and classifier, shared with the laptop extension (filter/shared), as the
      # folder "shared" in the app (InstagramFilter.swift).
      - path: ../filter/shared
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.browser
        PRODUCT_NAME: Browser
        INFOPLIST_FILE: Browser/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: D56QY8C7WL
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Browser AdHoc
  # The Instagram app (Flavor.swift; Joe, 2026-11-05): the Browser's code with INSTAGRAM_APP set, opening instagram.com
  # only, with its own name, icon, App ID and ad-hoc profile "Instagram AdHoc" (scripts/apple-provision.mjs Instagram).
  Instagram:
    type: application
    platform: iOS
    sources:
      - path: Browser
        excludes:
          - Info.plist
          - Assets.xcassets
      - path: Instagram
        excludes:
          - Info.plist
      - path: ../filter/shared
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.instagram
        PRODUCT_NAME: Instagram
        INFOPLIST_FILE: Instagram/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: D56QY8C7WL
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) INSTAGRAM_APP"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Instagram AdHoc
  # The Instagram app's own tests (its frame, dark and light; links), run on the simulator by ios-build.yml.
  InstagramTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: InstagramTests
    dependencies:
      - target: Instagram
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.instagram.tests
        CODE_SIGNING_ALLOWED: NO
  # The Facebook app (Flavor.swift; Joe, 2026-11-05: "we can start building a facebook version of our filtered app"):
  # the Browser's code with FACEBOOK_APP set, opening facebook.com only; its own App ID and profile "Facebook AdHoc".
  Facebook:
    type: application
    platform: iOS
    sources:
      - path: Browser
        excludes:
          - Info.plist
          - Assets.xcassets
      - path: Facebook
        excludes:
          - Info.plist
      - path: ../filter/shared
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.facebook
        PRODUCT_NAME: Facebook
        INFOPLIST_FILE: Facebook/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: D56QY8C7WL
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FACEBOOK_APP"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Facebook AdHoc
  # The Facebook app's own tests (its site, home, links), run on the simulator by ios-build.yml.
  FacebookTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FacebookTests
    dependencies:
      - target: Facebook
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.facebook.tests
        CODE_SIGNING_ALLOWED: NO
  BrowserTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BrowserTests
    dependencies:
      - target: Browser
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.browser.tests
        CODE_SIGNING_ALLOWED: NO
schemes:
  Browser:
    build:
      targets:
        Browser: all
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - BrowserTests
  Instagram:
    build:
      targets:
        Instagram: all
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - InstagramTests
  Facebook:
    build:
      targets:
        Facebook: all
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - FacebookTests

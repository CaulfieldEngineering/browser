# Joe's own iPhone browser (prototype, 2026-10-29: "Go ahead and build a prototype. For now just a basic, clean sleek
# browser."). XcodeGen turns this into Browser.xcodeproj on the macOS runner (.github/workflows/ios-build.yml).
# Signing is the HQ and Blocks setup: the same Apple team and Apple Distribution certificate, an ad-hoc profile of its
# own named exactly "Browser AdHoc" (scripts/apple-provision.mjs).
name: Browser
options:
  bundleIdPrefix: com.caulfieldengineering
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Browser:
    type: application
    platform: iOS
    sources:
      - path: Browser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.caulfieldengineering.browser
        PRODUCT_NAME: Browser
        INFOPLIST_FILE: Browser/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: D56QY8C7WL
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Browser AdHoc
schemes:
  Browser:
    build:
      targets:
        Browser: all
    archive:
      config: Release

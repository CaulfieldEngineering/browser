# Uploads the Browser to App Store Connect for TestFlight (Joe, 2026-10-29): Apple assesses the default browser
# permission only for an app on the App Store or on TestFlight. Run by hand only (Run workflow); it never submits for
# App Store review. The ad-hoc install page route (ios-build.yml) is separate and unchanged.
#
# Same as ios-build.yml up to the archive, then: the App Store profile "Browser AppStore" (scripts/apple-testflight.mjs
# profile), the APPSTORE compile flag (no install page updater, no own-install links), export for App Store Connect, and
# upload with the App Store Connect API key. Version 1.0 (the app record's), build number = this workflow's run number.
# After processing: node scripts/apple-testflight.mjs beta (the Public group, its link, beta review).

name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUNDLE_ID: com.caulfieldengineering.browser
  PROFILE_NAME: Browser AppStore   # must match the provisioning profile name in the Apple portal
  VERSION: "1.0"
  BUILD: ${{ github.run_number }}

jobs:
  upload:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Import signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$PROVISION_PROFILE_BASE64" ]; then echo "::error::IOS_APPSTORE_PROFILE_BASE64 is not set (scripts/apple-testflight.mjs profile, then apple-secrets.mjs)"; exit 1; fi
          CERT_PATH=$RUNNER_TEMP/dist.p12
          PROFILE_PATH=$RUNNER_TEMP/appstore.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

      - name: Archive
        run: |
          xcodebuild archive \
            -project ios/Browser.xcodeproj -scheme Browser -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Browser.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="APPSTORE"

      - name: Export for App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Browser.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo -n "$ASC_KEY_P8_BASE64" | base64 --decode -o "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal
          echo "Uploaded Browser $VERSION ($BUILD). Then: node scripts/apple-testflight.mjs builds, and beta once it is VALID." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up the key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect" "$RUNNER_TEMP/dist.p12"
